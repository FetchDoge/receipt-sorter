name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the sorter
        run: python -m py_compile receiptsort.py
      - name: Validate fixture ground truth parses and is non-empty
        run: python -c "import json; d=json.load(open('fixtures/ground-truth.json')); assert d, 'empty ground truth'; print('ground truth OK:', len(d), 'entries')"
